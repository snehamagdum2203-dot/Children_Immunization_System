{% extends 'base.html' %}
{% block title %}Hospital Login{% endblock %}
{% block content %}
<div class="wrap-sm">
  <div class="card">
    <div class="card-title">🏥 Hospital / PHC Login</div>
    <form method="POST" action="/hospital_login">
      <div class="form-group">
        <label>PHC Name</label>
        <input type="text" name="name" placeholder="Primary Health Centre name" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="PHC password" required/>
      </div>
      <button type="submit" class="btn btn-red btn-full">Login →</button>
    </form>
  </div>
</div>
{% endblock %}
