{% extends 'base.html' %}
{% block title %}Parents Login{% endblock %}
{% block content %}
<div class="wrap-sm">
  <div class="card">
    <div class="card-title">👨‍👩‍👧 Parents Login</div>
    <form method="POST" action="/parent_login">
      <div class="form-group">
        <label>Child's Name</label>
        <input type="text" name="child_name" placeholder="Child's full name (as registered)" required/>
      </div>
      <div class="form-group">
        <label>Your Mobile Number</label>
        <input type="text" name="mobile" placeholder="Registered mobile number" required/>
      </div>
      <button type="submit" class="btn btn-blue btn-full">View Child's Vaccines →</button>
    </form>
  </div>
</div>
{% endblock %}
